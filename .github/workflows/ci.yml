name: CI

# Integración continua de ColSong. Se usa solo la rama main, así que se valida cada push a main.
# (Los pull requests hacia main también se validan, por si algún día se usan.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read

# Si llega un push nuevo mientras otro CI sigue corriendo, se cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Base PostgreSQL desechable para probar contra el mismo motor que se usará en producción.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: colsong
          POSTGRES_PASSWORD: colsong
          POSTGRES_DB: colsong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colsong -d colsong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas (SQLite)
        run: python -m pytest -q
        env:
          # Las pruebas crean su propia base SQLite temporal; este secreto solo existe para el CI.
          JWT_SECRET: ci-only-secret-for-tests-0123456789abcdef

      - name: Pruebas (PostgreSQL)
        run: python -m pytest -q
        env:
          JWT_SECRET: ci-only-secret-for-tests-0123456789abcdef
          TEST_DATABASE_URL: postgresql://colsong:colsong@localhost:5432/colsong_test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar tipos
        run: pnpm typecheck

      - name: Compilar
        run: pnpm build
