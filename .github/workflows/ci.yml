name: CI

# Integración continua de ColSong. Se usa solo la rama main, así que se valida cada push a main.
# (Los pull requests hacia main también se validan, por si algún día se usan.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read

# Si llega un push nuevo mientras otro CI sigue corriendo, se cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas
        run: python -m pytest -q
        env:
          # Las pruebas crean su propia base SQLite temporal; este secreto solo existe para el CI.
          JWT_SECRET: ci-only-secret-for-tests-0123456789abcdef

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar tipos
        run: pnpm typecheck

      - name: Compilar
        run: pnpm build
